<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>支付宝支付测试</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; }
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            border-radius: 8px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #333;
        }
        input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            background: #1677ff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background: #4096ff;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2 style="text-align: center; color: #333;">支付宝支付测试</h2>
        <div class="form-group">
            <label>订单号</label>
            <input type="text" id="orderId" value="TEST_ORDER_001">
        </div>
        <div class="form-group">
            <label>金额 (元)</label>
            <input type="text" id="amount" value="0.01">
        </div>
        <div class="form-group">
            <label>商品名称</label>
            <input type="text" id="subject" value="测试商品">
        </div>
        <div class="form-group">
            <label>商品描述</label>
            <input type="text" id="body" value="测试商品描述">
        </div>
        <button onclick="createOrder()">立即支付</button>
    </div>

    <script>
        async function createOrder() {
            try {
                const data = {
                    orderId: document.getElementById('orderId').value,
                    amount: document.getElementById('amount').value,
                    subject: document.getElementById('subject').value,
                    body: document.getElementById('body').value
                };

                const response = await fetch('/create-order', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await response.text();
                document.open();
                document.write(result);
                document.close();
            } catch (error) {
                alert('创建订单失败：' + error.message);
            }
        }
    </script>
</body>
</html>
